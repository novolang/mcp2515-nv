[package]
name        = "mcp2515-nv"
version     = "0.1.0"
description = "A driver for Microchip's MCP2515 stand-alone CAN 2.0B controller on an SPI bus: embedded-hal-nv's CanBus with the bit timing computed from the crystal and the bit rate, the three transmit buffers with priority, the two receive buffers with masks, filters and rollover, the interrupt flags and the INT pin, the error counters and the bus-off state, and the normal, loopback, listen-only and one-shot modes."
license     = "Apache-2.0"
stability   = "experimental"
category    = "embedded"
layer       = "host"
tags        = ["mcp2515", "can", "can-bus", "spi", "controller", "nrf52840-dk", "nrf54lm20-dk"]
repository  = "https://github.com/novolang/mcp2515-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.24.0"

[docs.pages]
"README.md" = "Putting a CAN bus on an SPI port with an MCP2515"

[dependencies]
# The board's SPI bus, GPIO and timer handles, the SpiBus, GpioOut and
# Timer traits they implement, and the CanBus trait this driver implements.
embedded-hal-nv = "^0.3.2"
# The wiring record a board's device table hands `attach`, and the SPI
# transaction helpers.
devices-nv      = "^0.3.2"
